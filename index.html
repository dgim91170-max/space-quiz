<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101326">
  <title>Orbit — 우주 탐험 퀴즈</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --bg: #f3f5ff;
      --surface: rgba(255, 255, 255, .88);
      --surface-strong: #fff;
      --text: #19213b;
      --muted: #75809d;
      --line: #e6e9f4;
      --accent: #6958e8;
      --accent-soft: #efedff;
      --green: #159568;
      --green-soft: #e4f8ef;
      --red: #df5364;
      --red-soft: #fff0f1;
      --track-base: #e4e8f4;
      --track-tick: rgba(92, 102, 143, .16);
      --progress-start: #a69bff;
      --progress-end: #5e51df;
      --progress-glow: rgba(105, 88, 232, .34);
      --star-color: rgba(84, 76, 158, .34);
      --focus-ring: #4936c9;
      --console-bg: rgba(255, 255, 255, .72);
      --console-grid: rgba(84, 76, 158, .08);
      --console-border: rgba(105, 88, 232, .24);
      --shadow: 0 24px 70px rgba(48, 57, 103, .12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101326;
        --surface: rgba(27, 31, 55, .92);
        --surface-strong: #222743;
        --text: #f0f1ff;
        --muted: #a4abc9;
        --line: #363b5d;
        --accent: #a59aff;
        --accent-soft: #343057;
        --green: #69ddb0;
        --green-soft: #1d443d;
        --red: #ff8290;
        --red-soft: #4b2c3b;
        --track-base: #171b31;
        --track-tick: rgba(183, 190, 231, .15);
        --progress-start: #c2baff;
        --progress-end: #7669f5;
        --progress-glow: rgba(142, 128, 255, .46);
        --star-color: rgba(208, 204, 255, .55);
        --focus-ring: #d3ccff;
        --console-bg: rgba(16, 19, 38, .52);
        --console-grid: rgba(191, 184, 255, .08);
        --console-border: rgba(165, 154, 255, .25);
        --shadow: 0 24px 70px rgba(0, 0, 0, .3);
      }
    }

    * { box-sizing: border-box; }
    body {
      position: relative;
      isolation: isolate;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 12% 12%, rgba(147, 132, 255, .16), transparent 32%),
        radial-gradient(ellipse at 91% 83%, rgba(87, 208, 190, .12), transparent 30%),
        var(--bg);
      font-size: 15px;
      line-height: 1.55;
    }
    body::before, body::after {
      position: fixed;
      z-index: -1;
      inset: 0;
      background-repeat: repeat;
      content: "";
      pointer-events: none;
      animation: star-drift 28s ease-in-out infinite alternate;
    }
    body::before {
      opacity: .46;
      background-image:
        radial-gradient(1.5px 1.5px at 24px 36px, var(--star-color) 99%, transparent),
        radial-gradient(1px 1px at 117px 82px, var(--star-color) 99%, transparent),
        radial-gradient(1.2px 1.2px at 193px 17px, var(--star-color) 99%, transparent);
      background-size: 218px 154px, 263px 207px, 307px 239px;
    }
    body::after {
      opacity: .3;
      background-image:
        radial-gradient(1px 1px at 61px 127px, var(--star-color) 99%, transparent),
        radial-gradient(1.4px 1.4px at 169px 54px, var(--star-color) 99%, transparent);
      background-size: 291px 231px, 347px 283px;
      animation-duration: 36s;
      animation-direction: alternate-reverse;
    }

    button { font: inherit; }
    .app { width: min(100%, 520px); }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(140deg, #8b78ff, #5a4bdb);
      box-shadow: 0 5px 14px rgba(105, 88, 232, .28);
      font-size: 17px;
    }
    .card {
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .screen { padding: 34px; }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    h1, h2, p { margin-top: 0; }
    h1, h2 {
      margin-bottom: 12px;
      font-size: clamp(26px, 7vw, 36px);
      line-height: 1.13;
      letter-spacing: -.045em;
    }
    .intro-copy, .result-copy { color: var(--muted); font-size: 15px; }
    .hero-art {
      position: relative;
      display: grid;
      height: 168px;
      margin: 23px 0 25px;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 50%, rgba(165, 154, 255, .24), transparent 34%),
        linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--surface-strong) 72%, #90d9d2));
    }
    .hero-art::before, .hero-art::after {
      position: absolute;
      width: 190px;
      height: 62px;
      border: 1px solid rgba(123, 108, 225, .28);
      border-radius: 50%;
      content: "";
      transform: rotate(-23deg);
    }
    .hero-art::after { width: 250px; height: 88px; transform: rotate(28deg); }
    .planet { z-index: 1; font-size: 75px; filter: drop-shadow(0 10px 15px rgba(44, 37, 101, .2)); animation: float 4s ease-in-out infinite; }
    .spark { position: absolute; color: var(--accent); animation: twinkle 2s ease-in-out infinite; }
    .spark.one { top: 27px; left: 21%; font-size: 17px; }
    .spark.two { right: 20%; bottom: 25px; font-size: 13px; animation-delay: .6s; }
    .primary, .secondary {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 750;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .primary {
      color: #fff;
      background: linear-gradient(115deg, #7968f0, #5b4bd8);
      box-shadow: 0 9px 20px rgba(105, 88, 232, .25);
    }
    .primary:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(105, 88, 232, .34); }
    .primary:active, .answer:active { transform: scale(.985); }
    .secondary { color: var(--accent); background: var(--accent-soft); }
    .secondary:hover { transform: translateY(-1px); }
    button:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 3px;
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--focus-ring) 22%, transparent);
    }
    [hidden] { display: none !important; }

    .quiz-screen { padding: 28px 30px 30px; }
    .quiz-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .score-pill {
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: var(--surface-strong);
      white-space: nowrap;
    }
    .score-pill strong { color: var(--accent); }
    .progress-label {
      display: flex;
      justify-content: space-between;
      margin: 0 1px 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .progress-label span:last-child {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .progress-track {
      height: 17px;
      margin-bottom: 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background:
        repeating-linear-gradient(90deg, transparent 0 9%, var(--track-tick) 9% 10%),
        var(--track-base);
      box-shadow: inset 0 2px 4px rgba(20, 27, 55, .12), 0 1px 0 color-mix(in srgb, var(--surface-strong) 80%, transparent);
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 4px;
      background:
        repeating-linear-gradient(90deg, transparent 0 9%, rgba(255, 255, 255, .38) 9% 10%),
        linear-gradient(90deg, var(--progress-start), var(--progress-end));
      box-shadow: 0 0 12px var(--progress-glow);
      transition: width .55s cubic-bezier(.2, .8, .2, 1);
    }
    .question-title { margin-bottom: 22px; font-size: clamp(22px, 5vw, 27px); }
    .answers { display: grid; gap: 11px; }
    .answer {
      display: flex;
      width: 100%;
      min-height: 56px;
      align-items: center;
      gap: 13px;
      padding: 11px 15px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: var(--surface-strong);
      cursor: pointer;
      text-align: left;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }
    .answer:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
    .answer:focus-visible {
      position: relative;
      z-index: 1;
      border-color: var(--focus-ring);
      outline-offset: 3px;
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--focus-ring) 18%, transparent);
    }
    .answer:disabled { cursor: default; }
    .answer-letter {
      display: grid;
      flex: 0 0 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      color: var(--muted);
      background: var(--bg);
      font-size: 13px;
      font-weight: 800;
    }
    .answer.correct {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-soft);
      animation: pop .36s ease;
    }
    .answer.correct .answer-letter { color: #fff; background: var(--green); }
    .answer.wrong {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-soft);
      animation: shake .38s ease;
    }
    .answer.wrong .answer-letter { color: #fff; background: var(--red); }
    .feedback {
      min-height: 26px;
      margin: 17px 0 0;
      font-size: 14px;
      font-weight: 750;
      text-align: center;
    }
    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }
    .result-screen { padding: 25px 28px 28px; text-align: center; }
    .mission-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 23px;
      padding: 10px 12px;
      border: 1px solid var(--console-border);
      border-radius: 10px;
      color: var(--muted);
      background: var(--console-bg);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .12em;
      text-align: left;
    }
    .mission-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--green);
      letter-spacing: .08em;
      white-space: nowrap;
    }
    .mission-status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 9px color-mix(in srgb, currentColor 50%, transparent);
      content: "";
    }
    .result-emoji {
      position: relative;
      isolation: isolate;
    }
    .result-emoji::before,
    .result-emoji::after {
      position: absolute;
      z-index: -1;
      border: 1px solid var(--console-border);
      border-radius: 50%;
      content: "";
    }
    .result-emoji::before { inset: -10px -17px; transform: rotate(-24deg); }
    .result-emoji::after { inset: -17px -10px; transform: rotate(24deg); opacity: .65; }
    .result-screen.is-celebrating {
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 0, color-mix(in srgb, #f3c969 21%, transparent), transparent 49%),
        radial-gradient(ellipse at 100% 80%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 42%);
    }
    .result-screen.is-celebrating::before,
    .result-screen.is-celebrating::after {
      position: absolute;
      z-index: -1;
      width: 220px;
      height: 220px;
      border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }
    .result-screen.is-celebrating::before { top: -150px; left: -88px; box-shadow: 0 0 0 18px color-mix(in srgb, var(--accent) 5%, transparent), 0 0 0 38px color-mix(in srgb, var(--accent) 4%, transparent); }
    .result-screen.is-celebrating::after { right: -135px; bottom: -155px; width: 250px; height: 250px; }
    .result-emoji {
      display: grid;
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(145deg, var(--accent-soft), var(--green-soft));
      font-size: 53px;
      animation: float 3s ease-in-out infinite;
    }
    .is-celebrating .result-emoji {
      border-color: color-mix(in srgb, #e5b843 60%, var(--line));
      background: linear-gradient(145deg, color-mix(in srgb, #ffe9a8 72%, var(--surface-strong)), var(--accent-soft));
      box-shadow: 0 10px 32px rgba(214, 172, 65, .2);
    }
    .result-score-panel {
      margin: 17px 0 15px;
      padding: 13px 15px 14px;
      border: 1px solid var(--console-border);
      border-radius: 14px;
      background:
        linear-gradient(var(--console-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--console-grid) 1px, transparent 1px),
        var(--console-bg);
      background-size: 18px 18px;
      text-align: left;
    }
    .score-panel-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .result-score {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      margin: 1px 0 2px;
      color: var(--accent);
      font-size: 48px;
      font-weight: 850;
      letter-spacing: -.06em;
    }
    .result-score small { color: var(--muted); font-size: 17px; font-weight: 700; letter-spacing: 0; }
    .is-celebrating .result-score { text-shadow: 0 0 28px var(--progress-glow); }
    .result-meter {
      height: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: repeating-linear-gradient(90deg, var(--track-base) 0 8%, var(--track-tick) 8% 10%);
    }
    .result-meter-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: repeating-linear-gradient(90deg, transparent 0 8%, rgba(255, 255, 255, .4) 8% 10%), linear-gradient(90deg, var(--progress-start), var(--progress-end));
      box-shadow: 0 0 12px var(--progress-glow);
      transition: width .6s cubic-bezier(.2, .8, .2, 1);
    }
    .result-copy { margin-bottom: 20px; }
    .result-copy { margin-bottom: 25px; }
    .footer-note { margin: 15px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    .confetti {
      position: fixed;
      z-index: 5;
      top: -20px;
      width: 9px;
      height: 13px;
      border-radius: 3px;
      pointer-events: none;
      animation: fall 1.8s ease-in forwards;
    }
    @keyframes float { 50% { transform: translateY(-7px) rotate(2deg); } }
    @keyframes twinkle { 50% { opacity: .35; transform: scale(.72); } }
    @keyframes shake {
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes pop { 45% { transform: scale(1.025); } }
    @keyframes fall { to { transform: translate(var(--drift), 105vh) rotate(650deg); opacity: 0; } }
    @keyframes star-drift { to { background-position: 13px 19px, -11px 9px, 8px -13px; } }
    @media (max-width: 480px) {
      body { padding: 20px 14px; }
      .screen { padding: 27px 22px; }
      .quiz-screen { padding: 23px 19px 25px; }
      .hero-art { height: 145px; }
      .result-screen { padding: 21px 20px 23px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> ORBIT / 우주 탐험</div>
    <section class="card" aria-live="polite">
      <div class="screen intro-screen" id="intro">
        <p class="eyebrow">탐험을 시작해 볼까요?</p>
        <h1>우주에 대해 얼마나 알고 있나요?</h1>
        <p class="intro-copy">호기심을 가득 채우고 우주를 여행해 보세요. 열 가지 질문에 도전하고 멋진 점수를 받아 보세요.</p>
        <div class="hero-art" aria-hidden="true">
          <span class="spark one">✦</span><span class="spark two">✧</span><span class="planet">🪐</span>
        </div>
        <button class="primary" id="startButton">탐험 시작하기 <span aria-hidden="true">→</span></button>
      </div>

      <div class="screen quiz-screen" id="quiz" hidden>
        <div class="quiz-top">
          <span id="questionCount">질문 1 / 10</span>
          <span class="score-pill">✦ 점수 <strong id="score">0</strong></span>
        </div>
        <div class="progress-label" aria-hidden="true"><span>임무 진행률</span><span id="progressPercent">10%</span></div>
        <div class="progress-track" role="progressbar" aria-label="퀴즈 진행률" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1" aria-valuetext="10문항 중 1문항">
          <div class="progress-fill" id="progress"></div>
        </div>
        <p class="eyebrow" id="category">태양계</p>
        <h2 class="question-title" id="question"></h2>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" aria-live="assertive"></p>
      </div>

      <div class="screen result-screen" id="results" hidden>
        <div class="mission-header">
          <span>ORBIT // 임무 보고서</span>
          <span class="mission-status">임무 완료</span>
        </div>
        <div class="result-emoji" id="resultEmoji" aria-hidden="true">🚀</div>
        <p class="eyebrow">탐사 결과 분석</p>
        <h2 id="resultTitle">우주 탐험가!</h2>
        <div class="result-score-panel">
          <div class="score-panel-label"><span>미션 점수</span><span id="scorePercent">0% 정확도</span></div>
          <div class="result-score"><span id="finalScore">0</span><small>/ 10 정답</small></div>
          <div class="result-meter" role="progressbar" aria-label="정답 점수" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" aria-valuetext="10문항 중 0문항 정답">
            <div class="result-meter-fill" id="resultMeterFill"></div>
          </div>
        </div>
        <p class="result-copy" id="resultCopy"></p>
        <button class="secondary" id="restartButton">다시 탐험하기 <span aria-hidden="true">↻</span></button>
      </div>
    </section>
    <p class="footer-note">작은 호기심이 우주만큼 큰 발견을 만듭니다. ✨</p>
  </main>
  <script>
    const questions = [
      { category: "태양계", text: "붉은 행성이라는 별명으로 알려진 행성은 무엇일까요?", choices: ["금성", "화성", "목성", "수성"], answer: 1, fact: "화성은 철분이 풍부한 먼지 때문에 붉은빛을 띱니다." },
      { category: "달 탐사", text: "지구의 자연 위성 이름은 무엇일까요?", choices: ["유로파", "타이탄", "달", "포보스"], answer: 2, fact: "달은 평균적으로 지구에서 약 38만 4,400km 떨어져 있습니다." },
      { category: "거대 행성", text: "태양계에서 가장 큰 행성은 무엇일까요?", choices: ["토성", "해왕성", "지구", "목성"], answer: 3, fact: "목성 안에는 지구가 1,300개 넘게 들어갈 수 있습니다." },
      { category: "별빛", text: "지구에서 가장 가까운 별은 무엇일까요?", choices: ["시리우스", "태양", "프록시마 센타우리", "북극성"], answer: 1, fact: "태양은 약 1억 5천만 km 떨어져 있으며, 하나의 별입니다." },
      { category: "우주 역사", text: "달 표면을 처음으로 걸은 사람은 누구일까요?", choices: ["유리 가가린", "버즈 올드린", "닐 암스트롱", "존 글렌"], answer: 2, fact: "닐 암스트롱은 1969년에 달 표면을 밟았습니다." },
      { category: "고리 행성", text: "밝고 넓은 고리로 유명한 행성은 무엇일까요?", choices: ["토성", "화성", "금성", "수성"], answer: 0, fact: "토성의 고리는 대부분 얼음과 암석 조각으로 이루어져 있습니다." },
      { category: "깊은 우주", text: "우리 태양계가 속한 은하의 이름은 무엇일까요?", choices: ["안드로메다 은하", "소용돌이 은하", "우리은하", "솜브레로 은하"], answer: 2, fact: "우리 태양계는 우리은하의 나선팔 중 하나에 자리 잡고 있습니다." },
      { category: "달 이야기", text: "달이 지구 주위를 한 바퀴 도는 데 얼마나 걸릴까요?", choices: ["하루", "약 한 달", "1년", "10년"], answer: 1, fact: "달의 공전 주기는 약 27.3일입니다." },
      { category: "우주 날씨", text: "별똥별의 정체는 무엇일까요?", choices: ["아주 먼 별", "대기에서 타오르는 유성", "작은 행성", "혜성의 꼬리"], answer: 1, fact: "별똥별의 빛은 작은 우주 암석이 지구 대기에서 달아오르며 생깁니다." },
      { category: "붉은 행성", text: "2021년부터 화성을 탐사 중인 NASA 로버의 이름은 무엇일까요?", choices: ["큐리오시티", "오퍼튜니티", "퍼서비어런스", "스피릿"], answer: 2, fact: "퍼서비어런스는 고대 생명체 흔적을 찾기 위해 예제로 분화구에 착륙했습니다." }
    ];

    const intro = document.querySelector("#intro");
    const quiz = document.querySelector("#quiz");
    const results = document.querySelector("#results");
    const scoreEl = document.querySelector("#score");
    const questionEl = document.querySelector("#question");
    const answersEl = document.querySelector("#answers");
    const feedbackEl = document.querySelector("#feedback");
    const progressEl = document.querySelector("#progress");
    const progressTrack = document.querySelector('[role="progressbar"]');
    let current = 0;
    let score = 0;
    let locked = false;

    function renderQuestion() {
      const item = questions[current];
      locked = false;
      document.querySelector("#questionCount").textContent = `질문 ${current + 1} / ${questions.length}`;
      document.querySelector("#category").textContent = item.category;
      questionEl.textContent = item.text;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      answersEl.replaceChildren();
      item.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + index)}</span><span></span>`;
        button.lastElementChild.textContent = choice;
        button.addEventListener("click", () => chooseAnswer(index));
        answersEl.append(button);
      });
      const progress = current + 1;
      const percent = Math.round((progress / questions.length) * 100);
      progressEl.style.width = `${percent}%`;
      document.querySelector("#progressPercent").textContent = `${percent}%`;
      progressTrack.setAttribute("aria-valuenow", progress);
      progressTrack.setAttribute("aria-valuetext", `${questions.length}문항 중 ${progress}문항`);
      answersEl.querySelector("button")?.focus();
    }

    function chooseAnswer(selected) {
      if (locked) return;
      locked = true;
      const item = questions[current];
      const buttons = [...answersEl.children];
      buttons.forEach(button => { button.disabled = true; });
      if (selected === item.answer) {
        score++;
        scoreEl.textContent = score;
        buttons[selected].classList.add("correct");
        feedbackEl.textContent = `정답이에요! ${item.fact}`;
        feedbackEl.classList.add("good");
      } else {
        buttons[selected].classList.add("wrong");
        buttons[item.answer].classList.add("correct");
        feedbackEl.textContent = `아쉬워요! ${item.fact}`;
        feedbackEl.classList.add("bad");
      }
      window.setTimeout(() => {
        current++;
        if (current === questions.length) showResults();
        else renderQuestion();
      }, 1350);
    }

    function showResults() {
      quiz.hidden = true;
      results.hidden = false;
      progressEl.style.width = "100%";
      document.querySelector("#progressPercent").textContent = "100%";
      progressTrack.setAttribute("aria-valuenow", questions.length);
      progressTrack.setAttribute("aria-valuetext", `${questions.length}문항 완료`);
      document.querySelector("#finalScore").textContent = score;
      const scorePercent = Math.round((score / questions.length) * 100);
      document.querySelector("#scorePercent").textContent = `${scorePercent}% 정확도`;
      const resultMeter = document.querySelector(".result-meter");
      resultMeter.setAttribute("aria-valuenow", score);
      resultMeter.setAttribute("aria-valuetext", `${questions.length}문항 중 ${score}문항 정답`);
      document.querySelector("#resultMeterFill").style.width = `${scorePercent}%`;
      const result = score === 10
        ? ["🌟", "완벽한 우주 탐험!", "만점이에요! 진정한 우주 박사시군요. 계속 별을 향해 나아가세요."]
        : score >= 7
          ? ["🚀", "멋진 우주 탐험가!", "정말 잘했어요! 우주를 훤히 알고 있네요. 아직 발견할 것이 더 많답니다."]
          : score >= 4
            ? ["🪐", "반짝이는 유망주!", "우주를 멋지게 탐험했어요. 조금만 더 알아보면 최고 점수에 도달할 수 있어요."]
            : ["🌙", "호기심 많은 우주 신입!", "위대한 탐험도 작은 발걸음에서 시작돼요. 다시 도전해 볼까요?"];
      document.querySelector("#resultEmoji").textContent = result[0];
      document.querySelector("#resultTitle").textContent = result[1];
      document.querySelector("#resultCopy").textContent = result[2];
      results.classList.toggle("is-celebrating", score >= 8);
      if (score >= 8) celebrate();
      document.querySelector("#restartButton").focus();
    }

    function celebrate() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const colors = ["#8575f5", "#f0b84c", "#55c8a2", "#f07d91", "#56b9e8"];
      for (let i = 0; i < 38; i++) {
        const piece = document.createElement("i");
        piece.className = "confetti";
        piece.setAttribute("aria-hidden", "true");
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = colors[i % colors.length];
        piece.style.setProperty("--drift", `${Math.random() * 150 - 75}px`);
        piece.style.animationDelay = `${Math.random() * .65}s`;
        document.body.append(piece);
        window.setTimeout(() => piece.remove(), 2600);
      }
    }

    function startQuiz() {
      current = 0;
      score = 0;
      scoreEl.textContent = "0";
      intro.hidden = true;
      results.hidden = true;
      results.classList.remove("is-celebrating");
      quiz.hidden = false;
      renderQuestion();
    }
    document.querySelector("#startButton").addEventListener("click", startQuiz);
    document.querySelector("#restartButton").addEventListener("click", startQuiz);
  </script>
</body>
</html>
